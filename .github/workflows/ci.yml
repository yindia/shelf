name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Packages/Core

      - name: Build workspace
        run: swift build

      - name: Bundle app
        run: make bundle
