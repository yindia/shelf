name: Release

# Tag a release to publish a downloadable DMG:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Swift version
        run: swift --version

      - name: Test Core
        run: swift test --package-path Packages/Core

      - name: Build universal (arm64 + x86_64)
        run: make build-universal

      - name: Bundle app (universal binary)
        run: make bundle BINARY=.build/apple/Products/Release/ShelfApp

      - name: Stamp version into Info.plist
        run: |
          PLIST="build/Shelf.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          # Re-sign (ad-hoc) after editing the bundle so the signature stays valid.
          codesign --force --deep --sign - --entitlements Resources/Shelf.entitlements build/Shelf.app
          echo "Bundled architectures:" && lipo -archs build/Shelf.app/Contents/MacOS/ShelfApp

      - name: Package DMG
        run: make dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Shelf ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: build/Shelf.dmg
          body: |
            ## Shelf ${{ steps.ver.outputs.tag }}

            Download **Shelf.dmg**, open it, and drag **Shelf** to Applications.

            > This build is **ad-hoc signed, not notarized**. On first launch macOS
            > Gatekeeper will warn. Right-click **Shelf.app → Open**, or run
            > `xattr -dr com.apple.quarantine /Applications/Shelf.app`.
            > Grant **Accessibility** when prompted (needed for paste-back).

      - name: Update Homebrew cask on main
        run: |
          SHA=$(shasum -a 256 build/Shelf.dmg | awk '{print $1}')
          VER="${{ steps.ver.outputs.version }}"
          git fetch origin main
          git checkout main
          sed -i '' -E "s/version \"[^\"]*\"/version \"$VER\"/" Casks/shelf.rb
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"$SHA\"/" Casks/shelf.rb
          if ! git diff --quiet Casks/shelf.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update Homebrew cask to $VER" Casks/shelf.rb
            git push origin main
          fi
